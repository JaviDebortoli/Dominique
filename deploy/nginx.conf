# Nginx site config for Dominique (design.md "Technical Approach": PM2 →
# Nginx → Certbot on a DonWeb VPS; D8: uploads served by Nginx `alias`;
# Threat Matrix "Untrusted webhook intake": per-IP rate limit on the
# MercadoPago webhook path).
#
# Install: copy this file to /etc/nginx/sites-available/dominique.conf,
# symlink it into /etc/nginx/sites-enabled/, then `nginx -t && systemctl
# reload nginx`. Full step-by-step is in deploy/DEPLOY.md — this file is the
# config artifact, DEPLOY.md is the runbook.
#
# Replace every dominique.example.com below with the real domain before
# deploying.

# --- Rate limiting zone (Threat Matrix: "Untrusted webhook intake") -------
# One zone, keyed by client IP, 10MB (~160k tracked IPs) shared memory,
# allowing a sustained 5 requests/second per IP with a small burst.
# `limit_req_zone` is only valid in the http{} context — not inside
# server{}/location{} — but Debian/Ubuntu's stock nginx.conf (what DonWeb's
# Nginx package ships) already does `include /etc/nginx/sites-enabled/*;`
# directly inside its http{} block, so this top-level directive in a
# sites-enabled file IS in the http{} context. No separate conf.d file
# needed. DEPLOY.md shows the exact `nginx -T` check to confirm it's active.
limit_req_zone $binary_remote_addr zone=mp_webhook:10m rate=5r/s;

server {
    listen 80;
    listen [::]:80;
    server_name dominique.example.com;

    # Certbot's HTTP-01 challenge needs a plain-HTTP location to answer on
    # before a certificate exists; certbot --nginx (DEPLOY.md step 8) edits
    # this server block automatically to add the redirect below and the
    # matching 443 block once the cert is issued. Until then, everything
    # else on :80 is fine to leave proxying normally.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Uncomment after Certbot has issued the certificate (or let
    # `certbot --nginx` add this for you automatically):
    # location / {
    #     return 301 https://$host$request_uri;
    # }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # MercadoPago webhook intake (design.md Threat Matrix "Untrusted webhook
    # intake" — this is the ONE public, unauthenticated write path in the
    # whole app). Nginx-level per-IP rate limiting is a defense-in-depth
    # layer on top of the app's own x-signature HMAC validation
    # (src/modules/payments/mercadopago.ts) — it blunts brute-force/replay
    # flooding before it even reaches Node. `burst=10 nodelay` allows a
    # short burst (MP may retry a few notifications close together) while
    # still capping sustained abuse at 5 req/s per source IP.
    location /api/webhooks/mercadopago {
        limit_req zone=mp_webhook burst=10 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Product image uploads (design.md D8). Served directly by Nginx from
    # disk — never proxied to Node, never executed as a script. This is the
    # production counterpart of Phase 7's local-dev adaptation (see
    # app/api/admin/upload/route.ts's module doc): set UPLOAD_DIR=
    # /var/dominique/uploads in the app's env (see deploy/DEPLOY.md /
    # .env.example) so the app WRITES new uploads to the same directory
    # Nginx reads them from below. The app always returns URLs shaped
    # /uploads/products/<name>, which is exactly what this alias serves.
    location /uploads/ {
        alias /var/dominique/uploads/;

        # Threat Matrix "Documentation-like / executable-file
        # classification": even though app/api/admin/upload/route.ts already
        # rejects non-image bytes and re-encodes via sharp before anything
        # is written, this is a second independent layer — Nginx will never
        # treat anything under this alias as a script to execute, and always
        # serves it as a generic binary download regardless of extension.
        default_type application/octet-stream;

        # No fastcgi/proxy/alias-to-a-handler here — Nginx just streams the
        # file. There is no server-side scripting engine (PHP-FPM, uwsgi,
        # etc.) configured anywhere in this server block, so "no script
        # execution" is structural, not a toggle that could be misconfigured
        # per-location.
    }

    # SSL / Certbot managed certs — placeholder block. `certbot --nginx -d
    # dominique.example.com` (DEPLOY.md step 8) rewrites this file in place
    # to add the real `listen 443 ssl;` server block with
    # ssl_certificate/ssl_certificate_key pointing at
    # /etc/letsencrypt/live/dominique.example.com/{fullchain,privkey}.pem,
    # plus the managed `ssl_*` include and the 80→443 redirect above. Left
    # as a comment here (rather than a guessed cert path) so this file stays
    # valid `nginx -t` config before a certificate exists — DEPLOY.md step 8
    # walks through the exact certbot invocation.
    #
    # server {
    #     listen 443 ssl;
    #     listen [::]:443 ssl;
    #     server_name dominique.example.com;
    #     ssl_certificate     /etc/letsencrypt/live/dominique.example.com/fullchain.pem;
    #     ssl_certificate_key /etc/letsencrypt/live/dominique.example.com/privkey.pem;
    #     include /etc/letsencrypt/options-ssl-nginx.conf;
    #     ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    #     ... (same location blocks as the :80 server above)
    # }
}
